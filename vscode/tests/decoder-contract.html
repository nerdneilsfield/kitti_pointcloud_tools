<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>KPT decoder format contract</title>
</head>
<body data-state="loading">Testing decoder formats…</body>
<script>
  const points = [
    { x: 1, y: 2, z: 3, intensity: 0.5, r: 10, g: 20, b: 30, noise: 0 },
    { x: -1, y: -2, z: -3, intensity: 0.75, r: 40, g: 50, b: 60, noise: 2 },
  ];

  void (async () => {
    const source = await fetch("/vscode/dist/decoder.worker.js")
      .then((response) => response.blob());
    const workerUrl = URL.createObjectURL(source);
    const worker = new Worker(workerUrl);
    const wasmBinary = await fetch("/vscode/dist/kpt_decoder.wasm")
      .then((response) => response.arrayBuffer());
    const fixtures = createFixtures();
    let requestId = 0;
    for (const fixture of fixtures) {
      const bytes = fixture.bytes;
      const requestWasm = requestId === 0 ? wasmBinary.slice(0) : undefined;
      const result = await new Promise((resolve, reject) => {
        const timeout = setTimeout(
          () => reject(new Error(`${fixture.name}: timeout`)),
          30000,
        );
        worker.onmessage = (event) => {
          if (event.data.type === "decodeStarted") return;
          clearTimeout(timeout);
          resolve(event.data);
        };
        worker.onerror = (event) => {
          clearTimeout(timeout);
          reject(new Error(event.message));
        };
        const request = {
          type: "load",
          requestId: ++requestId,
          name: fixture.name,
          bytes,
          ...(requestWasm ? { wasmBinary: requestWasm } : {}),
        };
        worker.postMessage(
          request,
          requestWasm ? [bytes, requestWasm] : [bytes],
        );
      });
      assertFixture(fixture, result);
    }
    const invalidBin = new ArrayBuffer(16);
    new DataView(invalidBin).setUint32(0, 0x7fc00000, true);
    const invalidResult = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("invalid BIN timeout")),
        30000);
      worker.onmessage = (event) => {
        if (event.data.type === "decodeStarted") return;
        clearTimeout(timeout);
        resolve(event.data);
      };
      worker.postMessage({
        type: "load", requestId: ++requestId, name: "invalid.bin",
        bytes: invalidBin,
      }, [invalidBin]);
    });
    if (invalidResult.type !== "decodeError" ||
        invalidResult.code !== "invalid-input") {
      throw new Error(`invalid BIN accepted: ${JSON.stringify(invalidResult)}`);
    }
    worker.terminate();
    URL.revokeObjectURL(workerUrl);
    document.body.dataset.state = "passed";
    document.body.textContent =
      `${fixtures.length} formats passed (${fixtures.map((f) => f.name).join(", ")})`;
  })().catch((error) => {
    document.body.dataset.state = "failed";
    document.body.textContent = String(error);
  });

  function createFixtures() {
    const encode = (value) => new TextEncoder().encode(value).buffer;
    const bin = new ArrayBuffer(points.length * 4 * 4);
    const binView = new DataView(bin);
    points.forEach((point, index) => {
      const offset = index * 16;
      binView.setFloat32(offset, point.x, true);
      binView.setFloat32(offset + 4, point.y, true);
      binView.setFloat32(offset + 8, point.z, true);
      binView.setFloat32(offset + 12, point.intensity, true);
    });
    const rows = (fields) => points
      .map((point) => fields.map((field) => point[field]).join(" "))
      .join("\n");
    const pcd = `# .PCD v0.7
VERSION 0.7
FIELDS x y z intensity
SIZE 4 4 4 4
TYPE F F F F
COUNT 1 1 1 1
WIDTH 2
HEIGHT 1
POINTS 2
DATA ascii
${rows(["x", "y", "z", "intensity"])}
`;
    const noisyPcd = `VERSION 0.7
FIELDS x y z intensity noise
SIZE 4 4 4 4 1
TYPE F F F F U
COUNT 1 1 1 1 1
WIDTH 2
HEIGHT 1
POINTS 2
DATA ascii
${rows(["x", "y", "z", "intensity", "noise"])}
`;
    const ply = `ply
format ascii 1.0
element vertex 2
property float x
property float y
property float z
property uchar red
property uchar green
property uchar blue
property float intensity
end_header
${rows(["x", "y", "z", "r", "g", "b", "intensity"])}
`;
    const las = new ArrayBuffer(227 + points.length * 20);
    const lasBytes = new Uint8Array(las);
    lasBytes.set(new TextEncoder().encode("LASF"));
    const lasView = new DataView(las);
    lasView.setUint8(24, 1);
    lasView.setUint8(25, 2);
    lasView.setUint16(94, 227, true);
    lasView.setUint32(96, 227, true);
    lasView.setUint8(104, 0);
    lasView.setUint16(105, 20, true);
    lasView.setUint32(107, points.length, true);
    lasView.setFloat64(131, 0.01, true);
    lasView.setFloat64(139, 0.01, true);
    lasView.setFloat64(147, 0.01, true);
    points.forEach((point, index) => {
      const offset = 227 + index * 20;
      lasView.setInt32(offset, Math.round(point.x * 100), true);
      lasView.setInt32(offset + 4, Math.round(point.y * 100), true);
      lasView.setInt32(offset + 8, Math.round(point.z * 100), true);
      lasView.setUint16(offset + 12, Math.round(point.intensity * 65535), true);
    });
    const npyHeaderText =
      "{'descr': '<f4', 'fortran_order': False, 'shape': (2, 7), }\n";
    const npyHeader = new TextEncoder().encode(npyHeaderText);
    const npy = new ArrayBuffer(10 + npyHeader.byteLength + points.length * 28);
    const npyBytes = new Uint8Array(npy);
    npyBytes.set([0x93, 0x4e, 0x55, 0x4d, 0x50, 0x59, 1, 0]);
    new DataView(npy).setUint16(8, npyHeader.byteLength, true);
    npyBytes.set(npyHeader, 10);
    const npyView = new DataView(npy, 10 + npyHeader.byteLength);
    points.forEach((point, row) => {
      [point.x, point.y, point.z, point.r, point.g, point.b, point.intensity]
        .forEach((value, column) =>
          npyView.setFloat32((row * 7 + column) * 4, value, true));
    });
    const pts = `2\n${rows(["x", "y", "z", "intensity"])}\n`;
    const obj = `${points.map((point) =>
      `v ${point.x} ${point.y} ${point.z} ${point.r} ${point.g} ${point.b}`
    ).join("\n")}\n`;
    return [
      { name: "sample.obj", bytes: encode(obj), intensity: false, color: true },
      { name: "sample.pts", bytes: encode(pts), intensity: true, color: false },
      { name: "sample.bin", bytes: bin, intensity: true, color: false },
      { name: "sample.pcd", bytes: encode(pcd), intensity: true, color: false },
      { name: "noise.pcd", bytes: encode(noisyPcd), intensity: true, color: false, noise: true },
      { name: "sample.ply", bytes: encode(ply), intensity: true, color: true },
      { name: "sample.xyz", bytes: encode(rows(["x", "y", "z"])), intensity: false, color: false },
      { name: "sample.xyzi", bytes: encode(rows(["x", "y", "z", "intensity"])), intensity: true, color: false },
      { name: "sample.xyzrgb", bytes: encode(rows(["x", "y", "z", "r", "g", "b"])), intensity: false, color: true },
      { name: "sample.xyzrgbi", bytes: encode(rows(["x", "y", "z", "r", "g", "b", "intensity"])), intensity: true, color: true },
      { name: "sample.las", bytes: las, intensity: true, color: false,
        expectedIntensities: points.map((point) =>
          Math.round(point.intensity * 65535) / 65535), noise: true,
        expectedNoises: [0, 0], expectedNoiseCount: 0 },
      { name: "sample.npy", bytes: npy, intensity: true, color: true },
    ];
  }

  function assertFixture(fixture, result) {
    if (result.type !== "decoded") {
      throw new Error(`${fixture.name}: ${JSON.stringify(result)}`);
    }
    if (result.pointCount !== points.length) {
      throw new Error(`${fixture.name}: point count ${result.pointCount}`);
    }
    const expectedPositions = points.flatMap((point) => [
      point.x,
      point.y,
      point.z,
    ]);
    assertArray(fixture.name, "positions", result.positions, expectedPositions);
    assertArray(
      fixture.name,
      "intensities",
      result.intensities,
      fixture.expectedIntensities ??
        points.map((point) => fixture.intensity ? point.intensity : 0),
    );
    assertArray(
      fixture.name,
      "colors",
      result.colors,
      fixture.color
        ? points.flatMap((point) => [point.r, point.g, point.b])
        : [],
    );
    assertArray(
      fixture.name,
      "noises",
      result.noises,
      fixture.expectedNoises ??
        (fixture.noise ? points.map((point) => point.noise) : []),
    );
    if (result.hasColor !== fixture.color ||
        result.hasIntensity !== fixture.intensity ||
        result.hasNoise !== Boolean(fixture.noise) ||
        result.noiseCount !==
          (fixture.expectedNoiseCount ?? (fixture.noise ? 1 : 0))) {
      throw new Error(`${fixture.name}: schema flags mismatch`);
    }
    const expectedBounds = {
      min: [-1, -2, -3],
      max: [1, 2, 3],
    };
    if (JSON.stringify(result.bounds) !== JSON.stringify(expectedBounds)) {
      throw new Error(
        `${fixture.name}: bounds ${JSON.stringify(result.bounds)}`,
      );
    }
  }

  function assertArray(name, field, actual, expected) {
    if (
      actual.length !== expected.length ||
      actual.some((value, index) =>
        Math.abs(value - expected[index]) > 1e-6)
    ) {
      throw new Error(`${name}: ${field} mismatch`);
    }
  }
</script>
</html>
