<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>KPT decoder worker smoke</title>
</head>
<style>
  html, body, #viewer { width: 100%; height: 100%; margin: 0; }
  #controls-help { position: fixed; left: 12px; bottom: 12px; }
</style>
<body data-state="loading">
<div id="viewer"></div>
<div id="status">Starting…</div>
<section id="cloud-info" hidden>
  <span id="aabb-min"></span><span id="aabb-max"></span>
  <span id="aabb-size"></span><span id="noise-info"></span>
  <span id="grid-spacing"></span>
</section>
<div id="toolbar">
  <select id="color-mode">
    <option value="rgb">RGB</option>
    <option value="intensity">Intensity</option>
    <option value="height">Height</option>
    <option value="fixed">Fixed</option>
  </select>
  <input id="point-size" type="range" value="1.5">
  <input id="background" type="color" value="#1e1e1e">
  <button data-view="fit">Fit</button>
  <button id="reload">Reload</button>
  <button data-view="top">Top</button>
  <button data-view="front">Front</button>
  <button data-view="left">Left</button>
  <button data-view="right">Right</button>
  <button data-view="iso">Iso</button>
  <input id="show-axes" type="checkbox">
  <input id="show-grid" type="checkbox">
  <input id="highlight-noise" type="checkbox" checked>
  <input id="fixed-color" type="color" value="#ffffff">
  <input id="noise-color" type="color" value="#ff0000">
</div>
<details id="controls-help"><summary>Mouse controls</summary>
  <div>Fixed keyboard and mouse help</div>
</details>
<div id="player" style="display:none">
  <button id="play">▶</button>
  <input id="frame" type="range" min="0" max="0" value="0">
  <span id="frame-label">1 / 1</span>
  <select id="rate"><option value="5">5 fps</option></select>
</div>
<script>
  void (async () => {
    const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = (callback) =>
      nativeRequestAnimationFrame((time) => {
        document.body.dataset.animationFrames = String(
          Number(document.body.dataset.animationFrames ?? "0") + 1,
        );
        callback(time);
      });
    window.addEventListener("error", (event) => {
      document.body.dataset.state = "failed";
      document.getElementById("status").textContent = event.message;
    });
    window.addEventListener("unhandledrejection", (event) => {
      document.body.dataset.state = "failed";
      document.getElementById("status").textContent = String(event.reason);
    });
    window.loadNoiseFixture = () => {
      const pointCount = 100001;
      const records = new ArrayBuffer(pointCount * 13);
      const view = new DataView(records);
      for (let index = 0; index < pointCount; ++index) {
        const offset = index * 13;
        view.setFloat32(offset, index % 317 - 158, true);
        view.setFloat32(offset + 4, Math.floor(index / 317) - 158, true);
        view.setFloat32(offset + 8, 0, true);
        view.setUint8(offset + 12, index % 2);
      }
      const header = new TextEncoder().encode(`VERSION 0.7
FIELDS x y z noise
SIZE 4 4 4 1
TYPE F F F U
COUNT 1 1 1 1
WIDTH ${pointCount}
HEIGHT 1
POINTS ${pointCount}
DATA binary
`);
      const encoded = new Uint8Array(header.byteLength + records.byteLength);
      encoded.set(header);
      encoded.set(new Uint8Array(records), header.byteLength);
      const requestId = Number(document.body.dataset.loads ?? "0") + 1;
      document.body.dataset.loads = String(requestId);
      window.dispatchEvent(new MessageEvent("message", {
        data: {
          type: "load",
          requestId,
          name: "noise.pcd",
          bytes: encoded.buffer,
        },
      }));
    };
    window.acquireVsCodeApi = () => ({
      postMessage: async (message) => {
        if (message.type !== "ready" && message.type !== "reload") return;
        const bytes = await fetch("/data/000123.pcd")
          .then((response) => response.arrayBuffer());
        document.body.dataset.loads = String(
          Number(document.body.dataset.loads ?? "0") + 1,
        );
        window.dispatchEvent(new MessageEvent("message", {
          data: {
            type: "load",
            requestId: Number(document.body.dataset.loads),
            name: "000123.pcd",
            bytes,
          },
        }));
      },
    });
    const observer = new MutationObserver(() => {
      const status = document.getElementById("status");
      if (status?.dataset.kind === "error") {
        document.body.dataset.state = "failed";
      } else if (
        status?.dataset.kind === "ready" &&
        document.querySelector("canvas")
      ) {
        document.body.dataset.state = "passed";
      }
    });
    observer.observe(document.getElementById("status"), {
      attributes: true,
      childList: true,
    });
    const script = document.createElement("script");
    script.src = "/vscode/dist/webview.js";
    script.onerror = () => {
      document.body.dataset.state = "failed";
      document.getElementById("status").textContent =
        "cannot load webview bundle";
    };
    document.body.append(script);
  })();
</script>
</body>
</html>
