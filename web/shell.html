<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>KPT Web Workbench</title>
  <style>
    html, body, #canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #141416; color: #eee; font-family: sans-serif; }
    #canvas { display: block; }
    #fatal-error {
      position: fixed; inset: 1rem; z-index: 10; padding: 1rem;
      background: #401b1b; border: 1px solid #d66; white-space: pre-wrap;
    }
    #fatal-error[hidden] { display: none; }
    #fatal-reload { margin-top: 1rem; padding: .5rem 1rem; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="fatal-error" hidden>
    <div id="fatal-message"></div>
    <button id="fatal-reload" type="button">Reload</button>
  </div>
  <script>
    const canvas = document.getElementById("canvas");
    const fatalError = document.getElementById("fatal-error");
    const fatalMessage = document.getElementById("fatal-message");
    document.getElementById("fatal-reload").addEventListener(
      "click", () => location.reload(),
    );
    canvas.addEventListener("webglcontextlost", (event) => {
      event.preventDefault();
      fatalMessage.textContent =
        "KPT WebGL2 context was lost" +
        (event.statusMessage ? ": " + event.statusMessage : ".");
      fatalError.hidden = false;
      console.error(fatalMessage.textContent);
    });
    canvas.addEventListener("webglcontextrestored", () => location.reload());
    if (!globalThis.crossOriginIsolated) {
      fatalMessage.textContent =
        "KPT requires cross-origin isolation for WebAssembly threads. " +
        "Serve this directory with COOP: same-origin and COEP: require-corp.";
      fatalError.hidden = false;
    }
    var Module = {
      canvas,
      printErr: (...args) => console.error(...args),
      onRuntimeInitialized: () => {
        document.body.dataset.kptRuntime = "ready";
      },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
