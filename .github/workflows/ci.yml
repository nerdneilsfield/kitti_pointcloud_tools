name: Continuous integration

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every CI job regardless of changed paths
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.classify.outputs.native }}
      vscode: ${{ steps.classify.outputs.vscode }}
      browser: ${{ steps.classify.outputs.browser }}
      electron: ${{ steps.classify.outputs.electron }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: classify
        name: Select affected test suites
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_REQUESTED: ${{ inputs.full }}
        run: |
          set -euo pipefail
          native=false
          vscode=false
          browser=false
          electron=false

          run_all() {
            native=true
            vscode=true
            browser=true
            electron=true
          }

          if [[ "${FULL_REQUESTED:-false}" == "true" ]]; then
            echo "Full CI requested."
            run_all
          else
            base_sha="${BEFORE_SHA:-}"
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${PR_BASE_SHA:-}"
            fi

            # First push and an unavailable merge base are deliberately conservative.
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]] \
              || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "No trustworthy base revision; running full CI."
              run_all
            else
              changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
              if [[ -z "${changed_files}" ]]; then
                echo "No changed files; running full CI."
                run_all
              fi
              while IFS= read -r path; do
                [[ -z "${path}" ]] && continue
                echo "changed: ${path}"
                case "${path}" in
                  .github/**|.gitmodules|CMakeLists.txt|CMakePresets.json|cmake/**|src/**|tests/**|bindings/**|third_party/**|vcpkg.json|packaging/**|tools/**|VERSION)
                    run_all ;;
                  vscode/tests/browser-*|vscode/tests/worker-*|vscode/tests/decoder-*|vscode/tests/*.html)
                    vscode=true
                    browser=true ;;
                  vscode/**|.vscodeignore)
                    vscode=true
                    browser=true
                    electron=true ;;
                  # Documentation-only changes retain the always-present CI gate.
                  README*|docs/**|LICENSE|THIRD_PARTY_NOTICES)
                    ;;
                  # Unknown files may affect generated inputs or packaging: do not guess.
                  *)
                    run_all ;;
                esac
              done <<< "${changed_files}"
            fi
          fi

          printf 'native=%s\n' "${native}" >> "${GITHUB_OUTPUT}"
          printf 'vscode=%s\n' "${vscode}" >> "${GITHUB_OUTPUT}"
          printf 'browser=%s\n' "${browser}" >> "${GITHUB_OUTPUT}"
          printf 'electron=%s\n' "${electron}" >> "${GITHUB_OUTPUT}"
          printf 'Selected: native=%s vscode=%s browser=%s electron=%s\n' \
            "${native}" "${vscode}" "${browser}" "${electron}"

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 256M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build pkg-config libfreetype-dev libfontconfig1-dev
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-linux-system-debug-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-linux-system-debug-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'vcpkg.json') }}-
      - name: Verify pinned actions and configure
        run: |
          ./tools/check-action-pins.sh
          ./tools/check-third-party-inventory.sh
          cmake --preset linux-system-debug -DKPT_BUILD_GUI=OFF
      - name: Build and test
        run: |
          cmake --build --preset linux-system-debug --parallel
          ctest --preset linux-system-debug
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  sanitizer:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-system-asan-ubsan, linux-system-tsan]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 256M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build pkg-config libfreetype-dev libfontconfig1-dev
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'vcpkg.json') }}-
      - name: Sanitizer build and test
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --parallel
          ctest --preset "${{ matrix.preset }}"
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  vscode-build:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    name: VS Code extension build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 128M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-wasm-decoder-emsdk-6.0.5-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            kpt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-wasm-decoder-emsdk-6.0.5-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - id: setup-emsdk
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Retry Emscripten setup after transient failure
        if: steps.setup-emsdk.outcome == 'failure'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build VSIX
        run: ./tools/package-vsix.sh
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-runtime
          path: |
            artifacts/kitti-pointcloud-tools-*.vsix
            vscode/dist
          if-no-files-found: error
          retention-days: 1

  vscode-browser:
    name: VS Code webview browser tests
    needs: [changes, vscode-build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode-runtime
          path: .
      - name: Install test dependencies and headless Chromium
        run: |
          npm --prefix vscode ci
          npm --prefix vscode exec -- playwright install --with-deps chromium --only-shell
      - name: Run webview browser tests
        run: |
          python3 tools/serve_web.py . --port 8766 &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          for attempt in {1..50}; do
            curl --fail --silent http://127.0.0.1:8766/vscode/tests/worker-smoke.html \
              >/dev/null && break
            if [[ "${attempt}" == 50 ]]; then exit 1; fi
            sleep 0.1
          done
          npm --prefix vscode run test:browser

  vscode-electron:
    name: VS Code packaged extension tests
    needs: [changes, vscode-build]
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode-runtime
          path: .
      - name: Install test dependencies
        run: npm --prefix vscode ci
      - name: Run packaged extension tests
        run: |
          mkdir -p build/vsix-under-test
          unzip -q artifacts/kitti-pointcloud-tools-*.vsix -d build/vsix-under-test
          KPT_EXTENSION_PATH="$PWD/build/vsix-under-test/extension" \
            xvfb-run -a npm --prefix vscode run test:vscode

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, native, sanitizer, vscode-build, vscode-browser, vscode-electron]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to pass
        shell: bash
        env:
          NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
          VSCODE_SELECTED: ${{ needs.changes.outputs.vscode }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          ELECTRON_SELECTED: ${{ needs.changes.outputs.electron }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SANITIZER_RESULT: ${{ needs.sanitizer.result }}
          VSCODE_RESULT: ${{ needs.vscode-build.result }}
          BROWSER_RESULT: ${{ needs.vscode-browser.result }}
          ELECTRON_RESULT: ${{ needs.vscode-electron.result }}
        run: |
          set -euo pipefail
          failed=false
          if [[ "${CHANGES_RESULT}" != success ]]; then
            echo "Change classification failed: ${CHANGES_RESULT}" >&2
            failed=true
          fi
          require_success() {
            local selected="$1"
            local result="$2"
            local name="$3"
            echo "${name}: selected=${selected} result=${result}"
            if [[ "${selected}" == true && "${result}" != success ]]; then
              echo "Selected suite failed or was skipped: ${name}" >&2
              failed=true
            fi
          }
          require_success "${NATIVE_SELECTED}" "${NATIVE_RESULT}" native
          require_success "${NATIVE_SELECTED}" "${SANITIZER_RESULT}" sanitizer
          require_success "${VSCODE_SELECTED}" "${VSCODE_RESULT}" vscode-build
          require_success "${BROWSER_SELECTED}" "${BROWSER_RESULT}" vscode-browser
          require_success "${ELECTRON_SELECTED}" "${ELECTRON_RESULT}" vscode-electron
          [[ "${failed}" == false ]]
