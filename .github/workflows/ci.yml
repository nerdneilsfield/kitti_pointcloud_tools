name: Continuous integration

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every CI job regardless of changed paths
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify affected suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.classify.outputs.native }}
      vscode: ${{ steps.classify.outputs.vscode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - id: classify
        name: Select affected CI suites
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_REQUESTED: ${{ inputs.full }}
        run: |
          set -euo pipefail
          native=false
          vscode=false

          run_all() {
            native=true
            vscode=true
          }

          if [[ "${FULL_REQUESTED:-false}" == "true" ]]; then
            echo "Full CI requested."
            run_all
          else
            base_sha="${BEFORE_SHA:-}"
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${PR_BASE_SHA:-}"
            fi

            # Source paths, rather than generated semantic fingerprints, select suites.
            # Fingerprints are intentionally local developer aids and must not be a
            # correctness dependency of CI.
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]] \
              ; then
              echo "No base revision: selecting all semantic suites."
              run_all
            else
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "${base_sha}" || true
              fi
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                echo "Base unavailable: selecting all semantic suites."
                run_all
              fi
              changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" || true)"
              while IFS= read -r path; do
                [[ -z "${path}" ]] && continue
                echo "changed path: ${path}"
                case "${path}" in
                  .github/workflows/*|CMakeLists.txt|CMakePresets.json|cmake/*|vcpkg.json|tools/package-vsix.sh)
                    run_all
                    ;;
                  src/kpt/*|include/*)
                    native=true
                    vscode=true
                    ;;
                  src/gui/inspection_share.*|src/gui/scene/scene.*)
                    # Review Share and source-key validation are cross-runtime.
                    native=true
                    vscode=true
                    ;;
                  src/gui/*|tests/*|tools/*.sh)
                    native=true
                    ;;
                  vscode/*)
                    vscode=true
                    ;;
                  .github/semantic-fingerprints/*)
                    # Do not let stale generated fragments select or skip tests.
                    run_all
                    ;;
                  *)
                    # Unknown tracked code/configuration must fail closed.
                    run_all
                    ;;
                esac
              done <<< "${changed_files}"
            fi
          fi

          printf 'native=%s\n' "${native}" >> "${GITHUB_OUTPUT}"
          printf 'vscode=%s\n' "${vscode}" >> "${GITHUB_OUTPUT}"
          printf 'Selected fast suites: native=%s vscode=%s\n' "${native}" "${vscode}"

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 256M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build pkg-config libfreetype-dev libfontconfig1-dev
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-system-debug-clang-content-v1
      - name: Verify pinned actions and configure
        run: |
          ./tools/check-action-pins.sh
          ./tools/check-third-party-inventory.sh
          cmake --preset linux-system-debug -DKPT_BUILD_GUI=OFF
      - name: Build and test
        run: |
          cmake --build --preset linux-system-debug --parallel
          ctest --preset linux-system-debug
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  sanitizer:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-system-asan-ubsan, linux-system-tsan]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 256M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build pkg-config libfreetype-dev libfontconfig1-dev
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-clang-content-v1
      - name: Sanitizer build and test
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --parallel
          ctest --preset "${{ matrix.preset }}"
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  vscode-build:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    name: VS Code extension build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 128M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache xvfb
          mkdir -p "${CCACHE_DIR}"
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kpt-ccache-v2-${{ runner.os }}-${{ runner.arch }}-wasm-decoder-emsdk-6.0.5-content-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - id: setup-emsdk
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Retry Emscripten setup after transient failure
        if: steps.setup-emsdk.outcome == 'failure'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build VSIX
        run: ./tools/package-vsix.sh
      - name: Check extension and run integration tests
        run: |
          npm --prefix vscode run check
          xvfb-run --auto-servernum npm --prefix vscode run test:vscode
      - name: Install Chromium for browser smoke tests
        run: npm --prefix vscode exec -- playwright install --with-deps chromium
      - name: Run browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "${GITHUB_WORKSPACE}" \
            > "${RUNNER_TEMP}/kpt-browser-smoke-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          npm --prefix vscode run test:browser
      - name: Upload browser smoke server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-browser-smoke-log
          path: ${{ runner.temp }}/kpt-browser-smoke-server.log
          if-no-files-found: warn
          retention-days: 1
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-runtime
          path: |
            artifacts/kitti-pointcloud-tools-*.vsix
            vscode/dist
          if-no-files-found: error
          retention-days: 1

  metal-runtime:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: macOS Metal runtime smoke
    runs-on: macos-14
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build tools and pinned vcpkg baseline
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          git init "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "${VCPKG_ROOT}" fetch --depth=1 origin 99e82d9c9f0b281ec11fba48cc8434574a2b6e66
          git -C "${VCPKG_ROOT}" checkout --detach FETCH_HEAD
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure Metal runtime tests
        run: cmake --preset macos-arm64-vcpkg-debug
      - name: Build and run Metal renderer and runtime smoke tests
        run: |
          cmake --build --preset macos-arm64-vcpkg-debug --parallel --target \
            metal_renderer_tests metal_runtime_smoke_tests
          ctest --preset macos-arm64-vcpkg-debug --output-on-failure \
            -R 'metal_renderer_tests|metal_runtime_smoke_tests'

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, native, sanitizer, vscode-build, metal-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to pass
        shell: bash
        env:
          NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
          VSCODE_SELECTED: ${{ needs.changes.outputs.vscode }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SANITIZER_RESULT: ${{ needs.sanitizer.result }}
          VSCODE_RESULT: ${{ needs.vscode-build.result }}
          METAL_RESULT: ${{ needs.metal-runtime.result }}
        run: |
          set -euo pipefail
          failed=false
          if [[ "${CHANGES_RESULT}" != success ]]; then
            echo "Change classification failed: ${CHANGES_RESULT}" >&2
            failed=true
          fi
          require_success() {
            local selected="$1"
            local result="$2"
            local name="$3"
            echo "${name}: selected=${selected} result=${result}"
            if [[ "${selected}" == true && "${result}" != success ]]; then
              echo "Selected suite failed or was skipped: ${name}" >&2
              failed=true
            fi
          }
          require_success "${NATIVE_SELECTED}" "${NATIVE_RESULT}" native
          require_success "${NATIVE_SELECTED}" "${SANITIZER_RESULT}" sanitizer
          require_success "${NATIVE_SELECTED}" "${METAL_RESULT}" metal-runtime
          require_success "${VSCODE_SELECTED}" "${VSCODE_RESULT}" vscode-build
          [[ "${failed}" == false ]]
