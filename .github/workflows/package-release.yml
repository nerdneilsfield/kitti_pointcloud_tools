name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate global version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pinned GitHub Actions
        shell: bash
        run: ./tools/check-action-pins.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          ./tools/check-version.sh "${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must be vX.Y.Z: ${tag}" >&2
              exit 1
            fi
            ./tools/check-version.sh "${tag#v}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  deb:
    name: DEB Ubuntu ${{ matrix.ubuntu }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            runner: ubuntu-22.04
          - ubuntu: "24.04"
            runner: ubuntu-24.04
          - ubuntu: "26.04"
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - name: Build and package
        shell: bash
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: ./tools/package-deb.sh "${{ matrix.ubuntu }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-ubuntu${{ matrix.ubuntu }}
          path: artifacts/kitti-pointcloud-tools_${{ needs.version.outputs.value }}-1~ubuntu${{ matrix.ubuntu }}_amd64.deb
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 portable ZIP
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: ./.github/actions/setup-vcpkg
      - name: Build and package
        shell: pwsh
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos-arch:
    name: macOS ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            preset: macos-arm64-vcpkg-release
          - architecture: x86_64
            runner: macos-15-intel
            preset: macos-x64-vcpkg-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure and build
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DKPT_ENABLE_PACKAGING=ON \
            -DKPT_BUILD_TESTS=OFF
          cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Stage architecture
        shell: bash
        run: |
          ./packaging/macos/stage-arch.sh \
            "${{ matrix.architecture }}" \
            "build/${{ matrix.preset }}" \
            "build/package-macos-${{ matrix.architecture }}-stage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-stage-${{ matrix.architecture }}
          path: build/package-macos-${{ matrix.architecture }}-stage
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Universal macOS bundle and DMG
    needs: [version, macos-arch]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-stage-arm64
          path: build/downloaded-macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-stage-x86_64
          path: build/downloaded-macos-x86_64
      - name: Merge, sign, and package
        shell: bash
        run: |
          ./tools/package-macos.sh \
            build/downloaded-macos-arm64 \
            build/downloaded-macos-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dmg-macos-universal
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 30
  vsix:
    name: VS Code extension
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
      - name: Package VSIX
        shell: bash
        run: ./tools/package-vsix.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, deb, windows, macos-universal, vsix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dmg-macos-universal
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: artifacts
      - name: Validate release assets and checksums
        shell: bash
        run: |
          ./tools/validate-release-assets.sh "${VERSION}" artifacts
          for deb in artifacts/*~ubuntu*.deb; do
            mv "${deb}" "${deb/\~/.}"
          done
          (
            cd artifacts
            checksum_manifest="${RUNNER_TEMP}/SHA256SUMS"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z | xargs -0 sha256sum > "${checksum_manifest}"
            mv "${checksum_manifest}" SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Create complete release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --title "KPT ${tag}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${tag}" artifacts/* --clobber
          download_directory="$(mktemp -d)"
          gh release download "${tag}" --dir "${download_directory}"
          (
            cd "${download_directory}"
            sha256sum --check SHA256SUMS
          )
          for asset in artifacts/*; do
            cmp "${asset}" "${download_directory}/$(basename "${asset}")"
          done
          is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" == true ]]; then
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --prerelease=false \
              --latest
          fi
