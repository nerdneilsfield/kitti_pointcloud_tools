name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fixed archive/build metadata. Release identity remains the signed Git tag.
  SOURCE_DATE_EPOCH: "1704067200"

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate global version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.version.outputs.value }}
      deb_22: ${{ steps.semantic.outputs.deb_22 }}
      deb_24: ${{ steps.semantic.outputs.deb_24 }}
      deb_26: ${{ steps.semantic.outputs.deb_26 }}
      windows: ${{ steps.semantic.outputs.windows }}
      macos: ${{ steps.semantic.outputs.macos }}
      vsix: ${{ steps.semantic.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pinned GitHub Actions
        shell: bash
        run: |
          echo "::group::Release environment"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          uname -a
          df -h "${GITHUB_WORKSPACE}"
          echo "::endgroup::"
          ./tools/check-action-pins.sh
          ./tools/check-third-party-inventory.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "Validating release version ${version} for ${GITHUB_REF}"
          ./tools/check-version.sh "${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must be vX.Y.Z: ${tag}" >&2
              exit 1
            fi
            ./tools/check-version.sh "${tag#v}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"
      - id: semantic
        name: Read committed release fingerprints
        shell: bash
        run: |
          set -euo pipefail
          read_digest() {
            local file="$1"
            node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.schema !== 1 || value.sourceOnly !== true || !/^[a-f0-9]{64}$/.test(value.digest)) process.exit(1); process.stdout.write(value.digest)' "${file}"
          }
          echo "deb_22=$(read_digest .github/semantic-fingerprints/release-deb_22.json)" >> "${GITHUB_OUTPUT}"
          echo "deb_24=$(read_digest .github/semantic-fingerprints/release-deb_24.json)" >> "${GITHUB_OUTPUT}"
          echo "deb_26=$(read_digest .github/semantic-fingerprints/release-deb_26.json)" >> "${GITHUB_OUTPUT}"
          echo "windows=$(read_digest .github/semantic-fingerprints/release-windows.json)" >> "${GITHUB_OUTPUT}"
          echo "macos=$(read_digest .github/semantic-fingerprints/release-macos.json)" >> "${GITHUB_OUTPUT}"
          echo "vsix=$(read_digest .github/semantic-fingerprints/release-vsix.json)" >> "${GITHUB_OUTPUT}"

  deb:
    name: DEB Ubuntu ${{ matrix.ubuntu }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            runner: ubuntu-22.04
          - ubuntu: "24.04"
            runner: ubuntu-24.04
          - ubuntu: "26.04"
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: release-cache
        name: Restore exact DEB payload
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/kitti-pointcloud-tools_${{ needs.version.outputs.value }}-1~ubuntu${{ matrix.ubuntu }}_amd64.deb
          key: kpt-release-deb-v1-ubuntu${{ matrix.ubuntu }}-${{ matrix.ubuntu == '22.04' && needs.version.outputs.deb_22 || matrix.ubuntu == '24.04' && needs.version.outputs.deb_24 || needs.version.outputs.deb_26 }}
      - name: Build and package
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: |
          echo "::group::DEB build environment"
          cmake --version | head -n 1
          ninja --version
          docker --version
          echo "target=ubuntu-${{ matrix.ubuntu }} version=${{ needs.version.outputs.value }}"
          echo "::endgroup::"
          ./tools/package-deb.sh "${{ matrix.ubuntu }}"
          echo "::group::DEB artifact"
          ls -lh artifacts/kitti-pointcloud-tools_*~ubuntu${{ matrix.ubuntu }}_amd64.deb
          sha256sum artifacts/kitti-pointcloud-tools_*~ubuntu${{ matrix.ubuntu }}_amd64.deb
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-ubuntu${{ matrix.ubuntu }}
          path: artifacts/kitti-pointcloud-tools_${{ needs.version.outputs.value }}-1~ubuntu${{ matrix.ubuntu }}_amd64.deb
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64 portable ZIP
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: release-cache
        name: Restore exact Windows payload
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip
          key: kpt-release-windows-v1-${{ needs.version.outputs.windows }}
      - uses: ./.github/actions/setup-vcpkg
        if: steps.release-cache.outputs.cache-hit != 'true'
      - name: Install Windows icon generator
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install imagemagick.app --yes --no-progress
      - name: Build and package
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: |
          Write-Host "::group::Windows package environment"
          cmake --version | Select-Object -First 1
          ninja --version
          Write-Host "target=windows-x64 version=${{ needs.version.outputs.value }}"
          Write-Host "::endgroup::"
          ./tools/package-windows.ps1
          $asset = Get-Item "artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip"
          Write-Host "::group::Windows artifact"
          Write-Host ("size={0:N0} bytes" -f $asset.Length)
          Get-FileHash $asset.FullName -Algorithm SHA256 | Format-List
          Write-Host "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  macos-arch:
    name: macOS ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            preset: macos-arm64-vcpkg-release
          - architecture: x86_64
            runner: macos-15-intel
            preset: macos-x64-vcpkg-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: stage-cache
        name: Restore exact macOS architecture stage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/package-macos-${{ matrix.architecture }}-stage
          key: kpt-release-macos-stage-v1-${{ matrix.architecture }}-${{ needs.version.outputs.macos }}
      - uses: ./.github/actions/setup-vcpkg
        if: steps.stage-cache.outputs.cache-hit != 'true'
      - name: Configure and build
        if: steps.stage-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::group::macOS build environment"
          sw_vers
          cmake --version | head -n 1
          xcodebuild -version
          echo "architecture=${{ matrix.architecture }} preset=${{ matrix.preset }}"
          echo "::endgroup::"
          cmake --preset "${{ matrix.preset }}" \
            -DKPT_ENABLE_PACKAGING=ON \
            -DKPT_BUILD_TESTS=OFF \
            -DKPT_BUILD_GUI=ON \
            -DKPT_BUILD_RENDER=ON \
            -DENABLE_TOOLS=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Stage architecture
        if: steps.stage-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./packaging/macos/stage-arch.sh \
            "${{ matrix.architecture }}" \
            "build/${{ matrix.preset }}" \
            "build/package-macos-${{ matrix.architecture }}-stage"
          echo "::group::Staged macOS architecture"
          du -sh "build/package-macos-${{ matrix.architecture }}-stage"
          find "build/package-macos-${{ matrix.architecture }}-stage" -type f -maxdepth 3 -print | sort
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-stage-${{ matrix.architecture }}
          path: build/package-macos-${{ matrix.architecture }}-stage
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    name: Universal macOS bundle and DMG
    needs: [version, macos-arch]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      KPT_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: release-cache
        name: Restore exact notarized DMG
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          key: kpt-release-macos-dmg-v1-${{ needs.version.outputs.macos }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          name: macos-stage-arm64
          path: build/downloaded-macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          name: macos-stage-x86_64
          path: build/downloaded-macos-x86_64
      - name: Import Developer ID certificate
        if: ${{ steps.release-cache.outputs.cache-hit != 'true' && env.MACOS_CERTIFICATE_P12 != '' }}
        shell: bash
        env:
          CERTIFICATE_P12: ${{ env.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ env.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/kpt-signing.keychain-db"
          certificate="${RUNNER_TEMP}/kpt-signing.p12"
          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${certificate}"
          security create-keychain -p "" "${keychain}"
          security unlock-keychain -p "" "${keychain}"
          security import "${certificate}" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "${keychain}"
          security list-keychains -d user -s "${keychain}"
      - name: Merge, sign, and package
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::group::macOS merge inputs"
          du -sh build/downloaded-macos-arm64 build/downloaded-macos-x86_64
          if [[ -n "${KPT_CODESIGN_IDENTITY}" ]]; then
            echo "Developer ID signing requested"
          else
            echo "No Developer ID secret; producing ad-hoc signed DMG"
          fi
          echo "::endgroup::"
          ./tools/package-macos.sh \
            build/downloaded-macos-arm64 \
            build/downloaded-macos-x86_64
          echo "::group::macOS artifact"
          ls -lh artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          shasum -a 256 artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dmg-macos-universal
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 1
  vsix:
    name: VS Code extension
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - id: release-cache
        name: Restore exact VSIX payload
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          key: kpt-release-vsix-v1-${{ needs.version.outputs.vsix }}
      - id: setup-emsdk
        if: steps.release-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Retry Emscripten setup after transient failure
        if: steps.release-cache.outputs.cache-hit != 'true' && steps.setup-emsdk.outcome == 'failure'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Package VSIX
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::group::VSIX build environment"
          node --version
          npm --version
          emcc --version | head -n 1
          cmake --version | head -n 1
          echo "::endgroup::"
          ./tools/package-vsix.sh
          echo "::group::VSIX artifact"
          ls -lh artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          sha256sum artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, deb, windows, macos-universal, vsix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install release publishing tools
        shell: bash
        run: npm --prefix vscode ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dmg-macos-universal
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: artifacts
      - name: Validate release assets and checksums
        shell: bash
        run: |
          echo "::group::Downloaded release inputs"
          find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"
          ./tools/validate-release-assets.sh "${VERSION}" artifacts
          for deb in artifacts/*~ubuntu*.deb; do
            mv "${deb}" "${deb/\~/.}"
          done
          (
            cd artifacts
            checksum_manifest="${RUNNER_TEMP}/SHA256SUMS"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z | xargs -0 sha256sum > "${checksum_manifest}"
            mv "${checksum_manifest}" SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "::group::Release checksum manifest"
          cat artifacts/SHA256SUMS
          echo "::endgroup::"
      # Temporarily disabled until Marketplace authentication is migrated to OIDC.
      # - name: Publish VS Code Marketplace extension
      #   shell: bash
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: |
      #     test -n "${VSCE_PAT}" || {
      #       echo "VSCE_PAT is required for tagged releases" >&2
      #       exit 1
      #     }
      #     vscode/node_modules/.bin/vsce publish \
      #       --packagePath "artifacts/kitti-pointcloud-tools-${VERSION}.vsix" \
      #       --skip-duplicate \
      #       -p "${VSCE_PAT}"
      - name: Publish Open VSX extension
        shell: bash
        env:
          OPENVSX_ACCESS_TOKEN: ${{ secrets.OPENVSX_ACCESS_TOKEN }}
        run: |
          test -n "${OPENVSX_ACCESS_TOKEN}" || {
            echo "OPENVSX_ACCESS_TOKEN is required for tagged releases" >&2
            exit 1
          }
          source_vsix="artifacts/kitti-pointcloud-tools-${VERSION}.vsix"
          openvsx_vsix="artifacts/dengqi.pointcloud-tools-${VERSION}.vsix"
          ./tools/package-openvsx-vsix.sh "${source_vsix}" "${openvsx_vsix}"
          if ! curl --fail --silent --show-error \
              "https://open-vsx.org/api/dengqi" >/dev/null; then
            vscode/node_modules/.bin/ovsx create-namespace dengqi \
              -p "${OPENVSX_ACCESS_TOKEN}"
          fi
          vscode/node_modules/.bin/ovsx publish \
            "${openvsx_vsix}" --skip-duplicate -p "${OPENVSX_ACCESS_TOKEN}"
      - name: Create complete release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Publishing ${tag} from ${GITHUB_SHA}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --title "KPT ${tag}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${tag}" artifacts/* --clobber
          echo "::group::Uploaded assets"
          gh release view "${tag}" --json url,isDraft,assets \
            --jq '"url: " + .url, "draft: " + (.isDraft|tostring), (.assets[] | "asset: " + .name + " (" + (.size|tostring) + " bytes)")'
          echo "::endgroup::"
          download_directory="$(mktemp -d)"
          gh release download "${tag}" --dir "${download_directory}"
          (
            cd "${download_directory}"
            sha256sum --check SHA256SUMS
          )
          for asset in artifacts/*; do
            cmp "${asset}" "${download_directory}/$(basename "${asset}")"
          done
          echo "Downloaded release assets match local upload bytes"
          is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" == true ]]; then
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --prerelease=false \
              --latest
          fi
          gh release view "${tag}" --json url,isDraft,isPrerelease \
            --jq '"Release complete: " + .url + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring)'
