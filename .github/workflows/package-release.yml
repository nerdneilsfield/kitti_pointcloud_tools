name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fixed archive/build metadata. Release identity remains the signed Git tag.
  SOURCE_DATE_EPOCH: "1704067200"

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate global version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pinned GitHub Actions
        shell: bash
        run: |
          echo "::group::Release environment"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          uname -a
          df -h "${GITHUB_WORKSPACE}"
          echo "::endgroup::"
          ./tools/check-action-pins.sh
          ./tools/check-third-party-inventory.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "Validating release version ${version} for ${GITHUB_REF}"
          ./tools/check-version.sh "${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must be vX.Y.Z: ${tag}" >&2
              exit 1
            fi
            ./tools/check-version.sh "${tag#v}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"

  deb:
    name: DEB Ubuntu ${{ matrix.ubuntu }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            runner: ubuntu-22.04
          - ubuntu: "24.04"
            runner: ubuntu-24.04
          - ubuntu: "26.04"
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - name: Build and package
        shell: bash
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: |
          echo "::group::DEB build environment"
          cmake --version | head -n 1
          ninja --version
          docker --version
          echo "target=ubuntu-${{ matrix.ubuntu }} version=${{ needs.version.outputs.value }}"
          echo "::endgroup::"
          ./tools/package-deb.sh "${{ matrix.ubuntu }}"
          echo "::group::DEB artifact"
          ls -lh artifacts/kitti-pointcloud-tools_*~ubuntu${{ matrix.ubuntu }}_amd64.deb
          sha256sum artifacts/kitti-pointcloud-tools_*~ubuntu${{ matrix.ubuntu }}_amd64.deb
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-ubuntu${{ matrix.ubuntu }}
          path: artifacts/kitti-pointcloud-tools_${{ needs.version.outputs.value }}-1~ubuntu${{ matrix.ubuntu }}_amd64.deb
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 portable ZIP
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: ./.github/actions/setup-vcpkg
      - name: Install Windows icon generator
        shell: pwsh
        run: choco install imagemagick.app --yes --no-progress
      - name: Build and package
        shell: pwsh
        env:
          KPT_PACKAGE_VERIFY: "0"
        run: |
          Write-Host "::group::Windows package environment"
          cmake --version | Select-Object -First 1
          ninja --version
          Write-Host "target=windows-x64 version=${{ needs.version.outputs.value }}"
          Write-Host "::endgroup::"
          ./tools/package-windows.ps1
          $asset = Get-Item "artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip"
          Write-Host "::group::Windows artifact"
          Write-Host ("size={0:N0} bytes" -f $asset.Length)
          Get-FileHash $asset.FullName -Algorithm SHA256 | Format-List
          Write-Host "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos-arch:
    name: macOS ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            preset: macos-arm64-vcpkg-release
          - architecture: x86_64
            runner: macos-15-intel
            preset: macos-x64-vcpkg-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure and build
        shell: bash
        run: |
          echo "::group::macOS build environment"
          sw_vers
          cmake --version | head -n 1
          xcodebuild -version
          echo "architecture=${{ matrix.architecture }} preset=${{ matrix.preset }}"
          echo "::endgroup::"
          cmake --preset "${{ matrix.preset }}" \
            -DKPT_ENABLE_PACKAGING=ON \
            -DKPT_BUILD_TESTS=OFF \
            -DKPT_BUILD_GUI=ON \
            -DKPT_BUILD_RENDER=ON \
            -DENABLE_TOOLS=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Stage architecture
        shell: bash
        run: |
          ./packaging/macos/stage-arch.sh \
            "${{ matrix.architecture }}" \
            "build/${{ matrix.preset }}" \
            "build/package-macos-${{ matrix.architecture }}-stage"
          echo "::group::Staged macOS architecture"
          du -sh "build/package-macos-${{ matrix.architecture }}-stage"
          find "build/package-macos-${{ matrix.architecture }}-stage" -type f -maxdepth 3 -print | sort
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-stage-${{ matrix.architecture }}
          path: build/package-macos-${{ matrix.architecture }}-stage
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Universal macOS bundle and DMG
    needs: [version, macos-arch]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      KPT_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-stage-arm64
          path: build/downloaded-macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-stage-x86_64
          path: build/downloaded-macos-x86_64
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        shell: bash
        env:
          CERTIFICATE_P12: ${{ env.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ env.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/kpt-signing.keychain-db"
          certificate="${RUNNER_TEMP}/kpt-signing.p12"
          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${certificate}"
          security create-keychain -p "" "${keychain}"
          security unlock-keychain -p "" "${keychain}"
          security import "${certificate}" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "${keychain}"
          security list-keychains -d user -s "${keychain}"
      - name: Merge, sign, and package
        shell: bash
        run: |
          echo "::group::macOS merge inputs"
          du -sh build/downloaded-macos-arm64 build/downloaded-macos-x86_64
          if [[ -n "${KPT_CODESIGN_IDENTITY}" ]]; then
            echo "Developer ID signing requested"
          else
            echo "No Developer ID secret; producing ad-hoc signed DMG"
          fi
          echo "::endgroup::"
          ./tools/package-macos.sh \
            build/downloaded-macos-arm64 \
            build/downloaded-macos-x86_64
          echo "::group::macOS artifact"
          ls -lh artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          shasum -a 256 artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dmg-macos-universal
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 30
  vsix:
    name: VS Code extension
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - id: setup-emsdk
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Retry Emscripten setup after transient failure
        if: steps.setup-emsdk.outcome == 'failure'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "6.0.5"
          actions-cache-folder: emsdk-cache
          cache-key: kpt-emsdk-6.0.5-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Package VSIX
        shell: bash
        run: |
          echo "::group::VSIX build environment"
          node --version
          npm --version
          emcc --version | head -n 1
          cmake --version | head -n 1
          echo "::endgroup::"
          ./tools/package-vsix.sh
          echo "::group::VSIX artifact"
          ls -lh artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          sha256sum artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: artifacts/kitti-pointcloud-tools-${{ needs.version.outputs.value }}.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, deb, windows, macos-universal, vsix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dmg-macos-universal
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: artifacts
      - name: Validate release assets and checksums
        shell: bash
        run: |
          echo "::group::Downloaded release inputs"
          find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"
          ./tools/validate-release-assets.sh "${VERSION}" artifacts
          for deb in artifacts/*~ubuntu*.deb; do
            mv "${deb}" "${deb/\~/.}"
          done
          (
            cd artifacts
            checksum_manifest="${RUNNER_TEMP}/SHA256SUMS"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z | xargs -0 sha256sum > "${checksum_manifest}"
            mv "${checksum_manifest}" SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "::group::Release checksum manifest"
          cat artifacts/SHA256SUMS
          echo "::endgroup::"
      - name: Create complete release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Publishing ${tag} from ${GITHUB_SHA}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --title "KPT ${tag}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${tag}" artifacts/* --clobber
          echo "::group::Uploaded assets"
          gh release view "${tag}" --json url,isDraft,assets \
            --jq '"url: " + .url, "draft: " + (.isDraft|tostring), (.assets[] | "asset: " + .name + " (" + (.size|tostring) + " bytes)")'
          echo "::endgroup::"
          download_directory="$(mktemp -d)"
          gh release download "${tag}" --dir "${download_directory}"
          (
            cd "${download_directory}"
            sha256sum --check SHA256SUMS
          )
          for asset in artifacts/*; do
            cmp "${asset}" "${download_directory}/$(basename "${asset}")"
          done
          echo "Downloaded release assets match local upload bytes"
          is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" == true ]]; then
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release edit "${tag}" \
              --title "KPT ${tag}" \
              --prerelease=false \
              --latest
          fi
          gh release view "${tag}" --json url,isDraft,isPrerelease \
            --jq '"Release complete: " + .url + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring)'
