name: Set up pinned vcpkg
description: Bootstrap manifest baseline and restore the platform binary cache

runs:
  using: composite
  steps:
    - id: vcpkg-cache-key
      name: Compute dependency cache key
      shell: bash
      run: |
        node <<'NODE'
        const crypto = require('node:crypto');
        const fs = require('node:fs');
        const path = require('node:path');

        const manifest = JSON.parse(fs.readFileSync('vcpkg.json', 'utf8'));
        delete manifest['version-string'];
        const tripletDirectory = path.join('cmake', 'triplets');
        const triplets = fs.readdirSync(tripletDirectory)
          .filter((file) => file.endsWith('.cmake'))
          .sort()
          .map((file) => [file, fs.readFileSync(path.join(tripletDirectory, file), 'utf8')]);
        const input = JSON.stringify(manifest) + '\0' +
          triplets.map(([file, contents]) => `${file}\0${contents}`).join('\0');
        const digest = crypto.createHash('sha256').update(input).digest('hex');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${digest}\n`);
        NODE

    - name: Restore vcpkg binary cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/kpt-vcpkg-binary-cache
        key: kpt-vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache-key.outputs.value }}
        restore-keys: |
          kpt-vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-
          kpt-vcpkg-${{ runner.os }}-${{ runner.arch }}-

    - name: Bootstrap vcpkg on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        baseline="$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' vcpkg.json)"
        test -n "${baseline}"
        vcpkg_root="${RUNNER_TEMP}/vcpkg"
        binary_cache="${RUNNER_TEMP}/kpt-vcpkg-binary-cache"
        mkdir -p "${binary_cache}"
        git init "${vcpkg_root}"
        git -C "${vcpkg_root}" remote add origin https://github.com/microsoft/vcpkg.git
        for attempt in 1 2 3; do
          git -C "${vcpkg_root}" fetch --depth 1 origin "${baseline}" && break
          if [[ "${attempt}" == 3 ]]; then exit 1; fi
          sleep "$((attempt * 10))"
        done
        git -C "${vcpkg_root}" checkout --detach FETCH_HEAD
        for attempt in 1 2 3; do
          "${vcpkg_root}/bootstrap-vcpkg.sh" -disableMetrics && break
          if [[ "${attempt}" == 3 ]]; then exit 1; fi
          rm -f "${vcpkg_root}/vcpkg"
          sleep "$((attempt * 10))"
        done
        echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${binary_cache}" >> "${GITHUB_ENV}"

    - name: Bootstrap vcpkg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        if (-not $baseline) { throw "vcpkg.json has no builtin-baseline" }
        $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
        $binaryCache = Join-Path $env:RUNNER_TEMP "kpt-vcpkg-binary-cache"
        New-Item -ItemType Directory -Force $binaryCache | Out-Null
        git init $vcpkgRoot
        git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          git -C $vcpkgRoot fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 3) { throw "vcpkg fetch failed" }
          Start-Sleep -Seconds ($attempt * 10)
        }
        git -C $vcpkgRoot checkout --detach FETCH_HEAD
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 3) { throw "vcpkg bootstrap failed" }
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $vcpkgRoot "vcpkg.exe")
          Start-Sleep -Seconds ($attempt * 10)
        }
        "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
